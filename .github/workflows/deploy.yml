name: Deploy to GitHub Pages

on:
  push:
    branches: [main]     # main 에 push 하면 자동 배포
  workflow_dispatch:      # Actions 탭에서 수동 실행도 가능

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 살린다 (중간 것 취소)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 공개할 파일을 명시적으로 고른다.
      # 화이트리스트 방식 — 저장소에 뭘 추가하든 여기 안 적으면 공개되지 않는다.
      - name: 공개 파일 추리기
        run: |
          mkdir -p site
          cp index.html site/
          cp logo.jpg   site/   # 파비콘
          # 인쇄용 메뉴판 원본(2.1MB)은 페이지가 참조하지 않아 제외.
          # 공개하려면 아래 주석 해제:
          # cp 메뉴판.png site/
          touch site/.nojekyll   # Jekyll 전처리 끄기

      - name: 배포 전 점검
        run: |
          test -s site/index.html || { echo "::error::index.html 이 비어 있음"; exit 1; }
          if grep -q "확인 필요" site/index.html; then
            echo "::warning::아직 채우지 않은 placeholder가 있습니다:"
            grep -o "\[[^]]*확인 필요[^]]*\]" site/index.html | sed 's/^/  · /'
          fi
          echo "배포 대상:"; ls -la site/

      # enablement: 저장소 Settings 에서 Pages 를 손으로 켜지 않아도
      # 첫 실행 때 워크플로가 알아서 활성화한다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
